# Optional convenience wrapper for local development.
# The start/stop scripts in scripts/ drive Docker directly and are the primary path.
services:
  finally:
    build: .
    image: finally
    container_name: finally
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - finally-data:/app/db
    restart: unless-stopped

volumes:
  finally-data:
    name: finally-data
